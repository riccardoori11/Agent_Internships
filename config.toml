country = "fr"

[[sources]]
name = "Optioncarriere public search"
kind = "html_search"
url = "https://www.optioncarriere.com/recherche/emplois?s={query}&l={location}"
job_link_pattern = "/jobad/"
queries = ["stage C++", "C++ internship", "stagiaire C++", "C++ intern"]

[[sources]]
name = "Hellowork public search"
kind = "html_search"
url = "https://www.hellowork.com/fr-fr/emploi/recherche.html?k={query}&l={location}"
job_link_pattern = "/fr-fr/emplois/[0-9]+"
queries = ["stage C++", "C++ internship", "stagiaire C++", "C++ intern"]

[[sources]]
name = "Welcome to the Jungle public search"
kind = "html_search"
url = "https://www.welcometothejungle.com/fr/jobs?query={query}&aroundQuery={location}"
job_link_pattern = "/companies/[^/]+/jobs/"
queries = ["stage C++", "C++ internship", "stagiaire C++", "C++ intern"]
